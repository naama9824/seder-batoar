<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-label="איור גרף התקדמות עם עמודות עולות" fill="none">
  <defs>
    <linearGradient id="pc1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9B8FD4"/>
      <stop offset="1" stop-color="#7EC8E3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" rx="16" fill="#F5F4FB"/>
  <circle cx="330" cy="60" r="42" fill="#9B8FD4" opacity="0.16"/>
  <!-- chart baseline -->
  <line x1="70" y1="180" x2="340" y2="180" stroke="#ddd8f5" stroke-width="3" stroke-linecap="round"/>
  <!-- rising bars -->
  <rect x="90"  y="140" width="34" height="40"  rx="8" fill="url(#pc1)" opacity="0.55"/>
  <rect x="140" y="110" width="34" height="70"  rx="8" fill="url(#pc1)" opacity="0.70"/>
  <rect x="190" y="80"  width="34" height="100" rx="8" fill="url(#pc1)" opacity="0.85"/>
  <rect x="240" y="55"  width="34" height="125" rx="8" fill="url(#pc1)"/>
  <!-- trend line -->
  <polyline points="107,132 157,100 207,70 257,48" stroke="#9B8FD4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="257" cy="48" r="7" fill="#FFFFFF" stroke="#9B8FD4" stroke-width="3"/>
  <!-- percentage badge -->
  <circle cx="300" cy="150" r="26" fill="#FFFFFF" stroke="#7EC8E3" stroke-width="3"/>
  <path d="M290 150l7 7 12-14" stroke="#38a169" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
